[project]
name = "gestion-documental"
version = "0.1.0"
description = "Gestión documental con POO, arquitectura basada en eventos y MongoDB Atlas"
authors = [
    { name = "Juan Plata", email = "plata.barbosa@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.fastapi]
entrypoint = "gestion_documental.api.main:app"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
explicit_package_bases = true
exclude = ['^\.venv/']
plugins = ["pydantic.mypy"]
disable_error_code = ["type-abstract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integracion'"
markers = ["integracion: requiere MongoDB Atlas configurado en .env"]
